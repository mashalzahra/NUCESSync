<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUCESync Productivity</title>
<style>
/* header{background:#4b59ff;color:white;text-align:center;padding:1rem 0}
nav a{color:white;margin:0 15px;text-decoration:none;font-weight:bold}
header h1{text-align:center;margin-bottom:12px} */


/* ===== GENERAL LAYOUT ===== */
body {
    font-family: 'Open Sans', sans-serif;
    margin:0; 
    padding: 0;
    background: #ffffff; 
    color:#000000;
    overflow-x: hidden;
}
.layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 20px;
    padding: 20px;
    min-height: 100vh;
}
.box {
    border-radius: 10px;
    padding: 15px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(8px);
    border: 2px solid #000000;
    overflow: auto;
    min-height: 400px;
    box-shadow: 0 4px 10px #4b59ff;
}
header {
    width: 100%;
    padding: 4px 20px;
    background:#000000;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    box-sizing: border-box;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
.logo {
    font-size: 2em;
    font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    user-select: none;
    color: rgb(255, 255, 255);
    flex:1;
}
.navigation{
  margin-left: auto;
  display: flex;
  gap: 20px;
  margin-left: auto;
}
.navigation a{
    position: relative;
    font-size: 1.25em;
    color: white;
    text-decoration:none;
    font-weight: 500;
}
.navigation a:hover {
    text-decoration: underline;
}
/* DARK THEME */
.dark #box1 {
    background: rgba(0,0,0,0.6);
    border: 2px solid #4b59ff;
    box-shadow: 0 4px 10px #ffffff;
    color: #ffffff;
}
.dark #box1 .circle {
    background-color: #000000;
}
.dark #box1 .time p {
    color: #ffffff;
}
.dark #box2 {
    background: rgba(0,0,0,0.6);
    border: 2px solid #4b59ff;
    box-shadow: 0 4px 10px #ffffff;
    color: #ffffff;
}
.dark #box2 input, .dark #box2 select {
    background-color: #000000;
    color: #ffffff;
    border: 1px solid #4b59ff;
}
.dark #box2 button {
    background-color: #ffffff;
    color: #4b59ff;
}

/* Box placement */
#box1 { grid-column: 1; grid-row: 1; }
#box2 { grid-column: 2; grid-row: 1; }
#box3 { grid-column: 1 / span 2; grid-row: 2; }

/* ===== POMODORO (box1) ===== */
#box1 * { box-sizing: border-box; }
#box1 #icon { width: 30px; cursor:pointer; }
#box1 .container { display: flex; flex-direction: column; align-items: center; padding: 10px; }
#box1 .painel { display: grid; grid-template-columns: 1fr 1fr; text-align: center; width: 20rem; margin: 30px 0; padding: 1rem; border-radius: 10rem; box-shadow: 0px 0px 15px 10px #4b59ff; }
#box1 .painel p { opacity: .8; transition: 0.5s ease; cursor:pointer; }
#box1 .painel p.active { opacity: 1; color: #4b59ff; }
#box1 .timer { display:flex; justify-content:center; align-items:center; width: 25rem; height:25rem; border-radius:50%; box-shadow: 0px 0px 15px 10px #4b59ff; }
#box1 .circle { display:flex; justify-content:center; align-items:center; width:22rem; height:22rem; border-radius:50%; background-color:#4b59ff; position:relative; }
#box1 .time { display:flex; flex-direction:row; }
#box1 .time p { font-size:3rem; margin:0 5px; }
#box1 .controls { margin-top:20px; }
#box1 .controls button { border:none; background:transparent; cursor:pointer; }
#box1 #startpic, #box1 #replaypic { width:30px; cursor:pointer; }

/* ===== GPA Calculator (box2) ===== */
#box2 .card { background: rgba(255,255,255,0.05); padding:10px; border-radius:8px; }
#box2 h2, #box2 label, #box2 input, #box2 button { margin:5px 0; font-family:sans-serif; }
#box2 table { width:100%; border-collapse:collapse; margin-bottom:10px; }
#box2 th, #box2 td { text-align:left; padding:6px; }
#box2 input, #box2 select { padding:6px 8px; border-radius:6px; border:1px solid #555; background:transparent; color:#070101; }
#box2 button { padding:6px 12px; border-radius:6px; border:none; cursor:pointer; background:#4b59ff; color:#111; }

/* ===== To-Do List (box3) ===== */
#box3 h2, #box3 input, #box3 button { margin:5px 0; font-family:sans-serif; }
.box3 h2 { text-align:center; margin-bottom:14px; font-size:1.4rem; }
.progress-container { display:flex; gap:12px; justify-content:space-between; align-items:center; background:#ce9ecb; padding:10px; border-radius:8px; margin-bottom:16px; flex-wrap:wrap; }
.details h3 { font-size:1rem; margin:0; }
.progress-wrap { flex:1; min-width:160px; margin-left:6px; }
#progress-bar { width:100%; height:8px; background:#f0f0f0; border-radius:6px; overflow:hidden; margin-top:8px; }
#progress { width:0%; height:100%; background:#4b59ff; border-radius:6px; transition:width 300ms ease; }
.numbers { background:#ffffff; color:#4b59ff; padding:10px; border-radius:50%; font-weight:bold; font-size:0.9rem; width:52px; height:52px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.input-container { display:flex; gap:10px; margin:12px 0 18px; }
#todo-input { flex:1; padding:10px 12px; border:none; border-radius:6px; outline:none; background:#000000; color:#ffffff; }
#add-task-btn { background:#4b59ff; color:#fff; border:none; border-radius:6px; padding:10px 14px; cursor:pointer; }
ul { list-style:none; max-height:45vh; overflow:auto; padding:0; }
li { background:#4b59ff; padding:10px; margin-bottom:10px; border-radius:6px; display:flex; align-items:center; justify-content:space-between; color: #000000;}
li.completed .task-text { text-decoration:line-through; color:#140c0c; }
.task-buttons button { border:none; padding:6px 8px; border-radius:4px; cursor:pointer; color:#020202; }
.edit { background:#96e49a; color:#4b59ff; }
.delete { background:#ec756d; }
@media(max-width:480px){ .box3 { padding:16px; } .numbers { width:44px; height:44px; } }
</style>
</head>
<body>
<header>
        <h2 class="logo">NUCESSync</h2>
        <nav class="navigation">
            <a href="timetable.html">Home</a>
            <a href="index.html">Notes</a>
        </nav>
</header>
<div class="layout">

  <!-- Box 1: Pomodoro -->
  <div class="box" id="box1">
    <img src="moon.png" id="icon">
    <div class="container">
      <h1>Pomodoro</h1>
      <div class="painel">
        <p id="work" class="active">Work</p>
        <p id="break">Break</p>
      </div>
      <div class="timer">
        <div class="circle">
          <div class="time">
            <p id="minutes"></p><p>:</p><p id="seconds"></p>
          </div>
        </div>
      </div>
      <div class="controls">
        <button id="start"><img src="play-button-arrowhead.png" id="startpic"></button>
        <button id="reset"><img src="replay.png" id="replaypic"></button>
      </div>
    </div>
  </div>

  <!-- Box 2: GPA -->
  <div class="box" id="box2">
    <div class="card" id="gpaApp">
      <h2>GPA Calculator</h2>
      <div class="small">Add courses, choose letter grades and credits — GPA updates automatically.</div>
      <div class="controls" style="margin-top:12px">
        <button id="addCourse">+ Add Course</button>
        <button id="toggleTheme" style="margin-left:auto">Toggle Dark</button>
      </div>
      <table class="table" id="coursesTable">
        <thead>
          <tr><th>Course</th><th>Grade</th><th>Credits</th><th>Action</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="flex">
        <div class="gpa">Your GPA: <span id="gpaValue">0.00</span></div>
        <div class="right small">Total Credits: <span id="totalCredits">0</span></div>
      </div>
    </div>
  </div>

  <!-- Box 3: To-Do List -->
  <div class="box" id="box3">
    <h2>My To Do List</h2>
    <div class="progress-container">
      <div class="details">
        <h3>Keep it up!</h3>
        <div class="progress-wrap">
          <div id="progress-bar"><div id="progress"></div></div>
        </div>
      </div>
      <div class="numbers" id="numbers">0/0</div>
    </div>
    <div class="input-container">
      <input id="todo-input" type="text" placeholder="Add a new task..." />
      <button id="add-task-btn">Add</button>
    </div>
    <ul id="todo-list"></ul>
  </div>

</div>

<script>
/* ===== POMODORO ===== */
let workTitle = document.getElementById('work');
let breakTitle = document.getElementById('break');
let workTime = 25, breakTime = 5;
let seconds = 0, isWork = true, timerInterval;

function updateTimerDisplay(mins, secs){
  document.getElementById('minutes').textContent = mins.toString().padStart(2,'0');
  document.getElementById('seconds').textContent = secs.toString().padStart(2,'0');
}

window.onload = () => {
  updateTimerDisplay(workTime, 0);
};

function startPomodoro(){
  document.getElementById('start').style.display = 'none';
  seconds = 0;
  let minutes = workTime;
  isWork = true;
  workTitle.classList.add('active');
  breakTitle.classList.remove('active');

  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    if(seconds === 0){
      if(minutes===0){
        isWork = !isWork;
        minutes = isWork? workTime : breakTime;
        workTitle.classList.toggle('active', isWork);
        breakTitle.classList.toggle('active', !isWork);
      } else {
        minutes--;
        seconds = 59;
      }
    } else {
      seconds--;
    }
    updateTimerDisplay(minutes, seconds);
  },1000);
}
document.getElementById('start').onclick=startPomodoro;
document.getElementById('reset').onclick = ()=>{
  clearInterval(timerInterval);
  updateTimerDisplay(workTime,0);
  document.getElementById('start').style.display='block';
  workTitle.classList.add('active');
  breakTitle.classList.remove('active');
};

/* ===== GPA CALCULATOR ===== */
const gradePoints = {"A":4,"A-":3.7,"B+":3.3,"B":3,"B-":2.7,"C+":2.3,"C":2,"C-":1.7,"D+":1.3,"D":1.1,"D-":1,"F":0};
const tbodyGPA = document.getElementById('tbody');
const gpaValue = document.getElementById('gpaValue');
const totalCreditsEl = document.getElementById('totalCredits');

function createRow(course='', grade='A', credits=''){
  const tr = document.createElement('tr');
  const tdCourse = document.createElement('td');
  const inputCourse = document.createElement('input'); inputCourse.value=course; inputCourse.placeholder='Course'; tdCourse.appendChild(inputCourse);
  const tdGrade = document.createElement('td');
  const selectGrade = document.createElement('select');
  Object.keys(gradePoints).forEach(g=>{const o=document.createElement('option'); o.value=g;o.textContent=g; selectGrade.appendChild(o);});
  selectGrade.value=grade; tdGrade.appendChild(selectGrade);
  const tdCredits = document.createElement('td'); const inputCredits=document.createElement('input'); inputCredits.type='number'; inputCredits.step='0.25'; inputCredits.min='0'; inputCredits.value=credits; tdCredits.appendChild(inputCredits);
  const tdAction = document.createElement('td'); const del=document.createElement('button'); del.textContent='X'; del.onclick=()=>{tr.remove(); calculateGpa();}; tdAction.appendChild(del);
  tr.appendChild(tdCourse); tr.appendChild(tdGrade); tr.appendChild(tdCredits); tr.appendChild(tdAction);
  [selectGrade,inputCredits].forEach(el=>el.addEventListener('input',calculateGpa));
  tbodyGPA.appendChild(tr); calculateGpa(); return tr;
}
function calculateGpa(){
  let totalCredits=0, totalPoints=0;
  Array.from(tbodyGPA.querySelectorAll('tr')).forEach(r=>{
    const grade = r.cells[1].querySelector('select').value;
    const credits = parseFloat(r.cells[2].querySelector('input').value)||0;
    totalCredits+=credits; totalPoints+=credits*(gradePoints[grade]??0);
  });
  const gpa=totalPoints/totalCredits||0;
  gpaValue.textContent=gpa.toFixed(2);
  totalCreditsEl.textContent=totalCredits.toFixed(2);
}
document.getElementById('addCourse').addEventListener('click',()=>createRow());
if(tbodyGPA.children.length===0) createRow();
document.getElementById('toggleTheme').onclick=()=>{
  document.documentElement.classList.toggle('dark');
};

/* ===== TO-DO LIST ===== */
const input=document.getElementById('todo-input'), addBtn=document.getElementById('add-task-btn'), list=document.getElementById('todo-list'), numbers=document.getElementById('numbers'), progress=document.getElementById('progress');
const STORAGE_KEY='todo_tasks_v1'; let tasks=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');

function saveAndRender(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks)); renderTasks(); }

function addTask(text){ if(!text) return; tasks.push({id:Date.now(), text, completed:false}); saveAndRender(); }

function renderTasks(){
  list.innerHTML='';
  tasks.forEach(t=>{
    const li=document.createElement('li'); li.dataset.id=t.id; if(t.completed) li.classList.add('completed');
    li.innerHTML=`<div class="left"><label><input type="checkbox" ${t.completed?'checked':''}><span class="task-text">${t.text}</span></label></div>
    <div class="task-buttons"><button class="edit">Edit</button><button class="delete">Delete</button></div>`;
    list.appendChild(li);
  });
  const completed=tasks.filter(t=>t.completed).length;
  numbers.textContent=`${completed}/${tasks.length}`;
  progress.style.width=tasks.length===0?'0%':Math.round((completed/tasks.length)*100)+'%';
}

addBtn.onclick=()=>{addTask(input.value.trim()); input.value='';};
input.addEventListener('keydown', e => {
    if(e.key === 'Enter') {
        addTask(input.value.trim());
        input.value = '';
    }
});
list.addEventListener('click',e=>{
  const btn=e.target, li=btn.closest('li'); if(!li) return; const id=parseInt(li.dataset.id);
  if(btn.classList.contains('delete')) tasks=tasks.filter(t=>t.id!==id);
  else if(btn.classList.contains('edit')){ const t=tasks.find(t=>t.id===id); const newText=prompt('Edit task',t.text); if(newText&&newText.trim()!=='') t.text=newText.trim(); }
  else if(btn.tagName==='INPUT' && btn.type==='checkbox'){ const t=tasks.find(t=>t.id===id); t.completed=btn.checked; }
  saveAndRender();
});
document.getElementById('toggleTheme').onclick = () => {
    document.documentElement.classList.toggle('dark');
};

renderTasks();
</script>
</body>
</html>
