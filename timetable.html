<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="timetable.css">
</head>
<body>
    <header>
        <h2 class="logo">NUCESSync</h2>
        <nav class="centernavigation">
            <button id="openTimetableBtn" class="btn">Open Timetable</button>
            <button class="btn" onclick="openTaskPopup()">Open Task Scheduler</button>
        </nav>
        <nav class="rightnavigation">
            <button class="loginbutton">Login</button>
            <a href="index.html">Notes</a>
            <a href="productivity.html">Productivity</a>
        </nav>
    </header>
    <div class="popup" id="authPopup">
        <div class="wrapper">

            <div class="loginform">
                <h2>Login</h2>
                <form action="login">
                    <div class="inputbox">
                        <label for="email">EMAIL</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email">
                    </div>
                    <div class="inputbox">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="loginPassword" placeholder="Enter password">
                    </div>

                    <div class="remember">
                        <label><input type="checkbox">Remember Me</label>
                        <a href="#">Forgot Password?</a>
                    </div>
                    <div class="divider"></div>
                    <button type="button" id="loginSubmit" class="button">Login</button>
                    <div class="footer">
                        <p>Dont have an account?  <a href="#" class="register">Sign Up</a></p>
                    </div>
                </form>
            </div>

            <div class="registerform">
                <h2>Sign Up</h2>
                <form action="register">
                    <div class="inputbox">
                        <label for="name">USERNAME</label>
                        <input type="text" id="signupUsername" placeholder="Enter username">
                    </div>
                    <div class="inputbox">
                        <label for="email">EMAIL</label>
                        <input type="email" id="signupEmail" placeholder="Enter your email">
                    </div>
                    <div class="inputbox">
                        <label for="password">PASSWORD</label>
                         <input type="password" id="signupPassword" placeholder="Enter password">
                    </div>
                    <div class="divider"></div>
                    <button type="button" id="signupSubmit" class="button">Register</button>
                    <div class="footer">
                        <p>Already have an account? <a href="#" class="login">Login</a></p>
                    </div>
                </form>
            </div>
            <span class="close-btn" id="closePopup">&times;</span>
        </div>
    </div>

    <div id="timetableModal" class="timetable-popup">
        <div class="timetable-content">

            <span id="closeTimetable" class="timetable-close">&times;</span>

            <div class="container">
                <div class="header">
                    <h1>TimeTable</h1> 
                    <div class="date-display" id="dateDisplay"></div>
                </div>


                <div class="controls">
                    <button class="btn btn-primary" id="addEventBtn">Add Event</button>
                    <button class="btn btn-secondary" id="todayBtn">Today</button>
                    <button class="btn btn-secondary" id="clearAllBtn">Clear All</button>
                </div>
                <div class="calendar-container">
                    <div class="time-grid">
                        <div class="time-labels" id="timeLabels"></div>
                        <div class="calendar-body" id="calendarBody">
                            <div id="currentTimeIndicator" class="current-time-indicator" style="display: none;"></div>
                        </div>
                    </div>
                </div>
            </div>

            
            <div class="modal" id="eventModal">
                <div class="modal-content">
                    <h3 id="modalTitle">Add New Event</h3>

                    <form id="eventForm">
                        <div class="form-group">
                            <label for="eventTitle">Event Title</label>
                            <input type="text" id="eventTitle" placeholder="Enter EventTitle" required>
                        </div>

                        <div class="form-group">
                            <label for="eventStart">Start Time</label>
                            <input type="time" id="eventStart" required>
                        </div>

                        <div class="form-group">
                            <label for="eventEnd">End Time</label>
                            <input type="time" id="eventEnd" required>
                        </div>

                        <div class="form-group">
                            <label for="eventColor">Color</label>
                            <select id="eventColor">
                                <option value="blue">Blue</option>
                                <option value="green">Green</option>
                                <option value="red">Red</option>
                            </select>
                        </div>
                        <div class="modal-actions">
                            <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
                        </div>
                </form>
        </div>
    </div>
    <script src="timetable.js"></script>
    </div>
</div>


<!--STARTING TASK SCHEDULER-->
<!-- POPUP OVERLAY (ADDED FOR POPUP FEATURE) -->
<div id="taskPopup" style="
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); /* dark background */
    display: none;               /* hidden by default */
    justify-content: center;
    align-items: center;
    z-index: 9999;
">
    <!-- POPUP BOX (ADDED FOR POPUP LAYOUT) -->
    <div style="
        background: white;
        width: 90%;
        max-width: 700px;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
        position: relative;
        max-height: 90%;
        overflow-y: auto;
    ">
        <!-- CLOSE BUTTON (ADDED) -->
        <button onclick="closeTaskPopup()" style="
            position: absolute;
            top: 10px; right: 15px;
            background: #ff3b3b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        ">X</button>

        <h1 style="text-align:center;">Task Scheduler</h1>

        <!-- ORIGINAL TASK FORM (UNCHANGED) -->
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <input type="text" id="task" placeholder="Enter task..." style="flex:1; padding:5px;">
            
            <select id="priority" style="padding:5px;">
                <option value="top">Top Priority</option>
                <option value="middle">Middle Priority</option>
                <option value="low">Less Priority</option>
            </select>
            
            <input type="datetime-local" id="deadline" style="padding:5px;">
            
            <button id="add-task" style="
                padding:5px 10px;
                background:#4b59ff;
                color:white;
                border:none;
                border-radius:5px;
                cursor:pointer;
            ">Add</button>
        </div>

        <!-- ORIGINAL TASK LIST (UNCHANGED) -->
        <div id="task-list" style="border:1px solid #ddd; padding:10px; border-radius:5px;"></div>
    </div>
</div>

<!-- INLINE JAVASCRIPT -->
<script>
    /* ADDED — FUNCTION TO OPEN POPUP */
    function openTaskPopup() {
        document.getElementById("taskPopup").style.display = "flex";
    }

    /* ADDED — FUNCTION TO CLOSE POPUP */
    function closeTaskPopup() {
        document.getElementById("taskPopup").style.display = "none";
    }

    /* ORIGINAL JS FOR TASK SCHEDULER (UNCHANGED) */
    const taskInput = document.getElementById("task");
    const priorityInput = document.getElementById("priority");
    const deadlineInput = document.getElementById("deadline");
    const addTaskButton = document.getElementById("add-task");
    const taskList = document.getElementById("task-list");

    addTaskButton.addEventListener("click", () => {
        const task = taskInput.value;
        const priority = priorityInput.value;
        const deadline = deadlineInput.value;

        if (task.trim() === "" || deadline === "") {
            alert("Please enter a task and select a deadline.");
            return;
        }

        const selectedDate = new Date(deadline);
        const currentDate = new Date();

        if (selectedDate <= currentDate) {
            alert("Please select an upcoming date.");
            return;
        }

        const taskItem = document.createElement("div");
        taskItem.style.cssText =
            "display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:5px; border:1px solid #ccc; border-radius:5px;";

        taskItem.innerHTML = `
            <p>${task}</p>
            <p>Priority: ${priority}</p>
            <p>${selectedDate.toLocaleString()}</p>
            <button class="mark-done" style="background:#28a745; color:white; border:none; padding:5px; border-radius:5px; cursor:pointer;">Done</button>
            <button class="delete-task" style="background:#ff3b3b; color:white; border:none; padding:5px; border-radius:5px; cursor:pointer;">Delete</button>
        `;

        taskList.appendChild(taskItem);

        const now = new Date();
        const reminderTime = new Date(selectedDate.getTime() - 24 * 60 * 60 * 1000);
        let timeDiff = reminderTime - now;

        if (timeDiff > 0) {
            setTimeout(() => {
                alert(`Reminder: "${task}" is due in 24 hours!`);
            }, timeDiff);
        } else {
            timeDiff = selectedDate - now;
            if (timeDiff > 0) {
                setTimeout(() => {
                    alert(`Reminder: "${task}" is due soon!`);
                }, timeDiff);
            }
        }

        taskInput.value = "";
        priorityInput.value = "top";
        deadlineInput.value = "";
    });

    taskList.addEventListener("click", (event) => {
        const taskItem = event.target.parentElement;

        if (event.target.classList.contains("mark-done")) {
            taskItem.style.background = "#f2f2f2";
            event.target.disabled = true;
        }

        if (event.target.classList.contains("delete-task")) {
            taskItem.remove();
        }
    });
</script>
<!--START EXAM COUNTDOWN-->
<div style="
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
">
    <div style="
        position:relative;
        background:white;
        padding:30px;
        border-radius:12px;
        max-width:1000px;
        height: 500px;
        width:90%;
        text-align:center;
        color:black;
        display: flex;
        flex-direction: column;
        justify-content: center;  
        align-items: center; 
    ">

        <!-- CONTENT -->
        <h1 style="font-size:48px; font-weight:600;">
            Days Left Before the <span style="color:blueviolet;">Finals</span>
        </h1>

        <div style="display:flex; justify-content:center; gap:20px; margin-top:20px;">
            <div>
                <p id="days" style="font-size:60px; margin-bottom:-14px;">00</p>
                <span>Days</span>
            </div>
            <div>
                <p id="hours" style="font-size:60px; margin-bottom:-14px;">00</p>
                <span>Hours</span>
            </div>
            <div>
                <p id="minutes" style="font-size:60px; margin-bottom:-14px;">00</p>
                <span>Minutes</span>
            </div>
            <div>
                <p id="seconds" style="font-size:60px; margin-bottom:-14px;">00</p>
                <span>Seconds</span>
            </div>
        </div>
    </div>
</div>

<!-- INLINE JS -->
<script>
    const wrapper =  document.querySelector('.wrapper');
    const login = document.querySelector('.login');
    const register = document.querySelector('.register');
    const button = document.querySelector('.loginbutton');

    const authPopup = document.getElementById('authPopup');
    const closePopup = document.getElementById('closePopup');

    button.addEventListener('click', ()=> {
        authPopup.style.display= 'flex';
        wrapper.classList.remove('active'); 
    })
    closePopup.addEventListener('click', ()=> {
        authPopup.style.display = 'none';
    });
    register.addEventListener('click', ()=> {
        wrapper.classList.add('active');
    });
    login.addEventListener('click', ()=> {
        wrapper.classList.remove('active');
    });
    button.addEventListener('click', ()=> {
        wrapper.classList.add('active-popup');
    });


    var countDownDate = new Date("Dec 15, 2025 00:00:00").getTime();
    var x = setInterval(function(){
        var now = new Date().getTime();
        var distance = countDownDate - now;

        var days = Math.floor(distance / (1000 * 60 * 60 * 24));
        var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").innerHTML = days;
        document.getElementById("hours").innerHTML = hours;
        document.getElementById("minutes").innerHTML = minutes;
        document.getElementById("seconds").innerHTML = seconds;

        if(distance < 0){
            clearInterval(x);
            document.getElementById("days").innerHTML = "00";
            document.getElementById("hours").innerHTML = "00";
            document.getElementById("minutes").innerHTML = "00";
            document.getElementById("seconds").innerHTML = "00";
        }

    },1000);
    
    document.addEventListener("DOMContentLoaded", () => {
    const wrapper = document.querySelector('.wrapper');
    const loginLink = document.querySelector('.login');
    const registerLink = document.querySelector('.register');
    const authPopup = document.getElementById('authPopup');
    const closePopup = document.getElementById('closePopup');
    const loginButton = document.querySelector('.loginbutton');

    const loginSubmit = document.getElementById("loginSubmit");
    const signupSubmit = document.getElementById("signupSubmit");

    loginButton.addEventListener('click', () => {
        authPopup.style.display = 'flex';
        wrapper.classList.remove('active');
        wrapper.classList.add('active-popup');
    });

    closePopup.addEventListener('click', () => {
        authPopup.style.display = 'none';
    });

    registerLink.addEventListener('click', (e) => {
        e.preventDefault();
        wrapper.classList.add('active');
    });

    loginLink.addEventListener('click', (e) => {
        e.preventDefault();
        wrapper.classList.remove('active');
    });

    loginSubmit.addEventListener('click', () => {
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        if (!email || !password) {
            alert("Please enter both email and password.");
            return;
        }

        if (email === "test@example.com" && password === "123456") {
            alert("Login successful!");
            authPopup.style.display = 'none';
        } else {
            alert("Invalid email or password (try test@example.com / 123456)");
        }
    });

    signupSubmit.addEventListener('click', () => {
        const username = document.getElementById("signupUsername").value;
        const email = document.getElementById("signupEmail").value;
        const password = document.getElementById("signupPassword").value;

        if (!username || !email || !password) {
            alert("Please fill all fields.");
            return;
        }

        alert(`Signup successful! Welcome, ${username}.`);
        authPopup.style.display = 'none';
    });
});
</script>



</body>
